<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newtab Sun Palette Compare</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07101d;
        --panel: rgba(10, 16, 28, 0.9);
        --line: rgba(111, 213, 255, 0.2);
        --text: #e8f3ff;
        --muted: #93a9c8;
        --cyan: #6fe5ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(111, 229, 255, 0.1), transparent 24%),
          linear-gradient(180deg, #09111d 0%, #050913 100%);
      }

      .wrap {
        width: min(1380px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 36px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(13, 21, 35, 0.96), rgba(8, 13, 22, 0.96));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      }

      .head {
        padding: 16px 18px 14px;
        border-bottom: 1px solid rgba(111, 213, 255, 0.12);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      h2 {
        margin: 0;
        font-size: 18px;
      }

      .mock {
        position: relative;
        min-height: 360px;
        background: #08111d;
        overflow: hidden;
      }

      .scene {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 135, 103, 0.12), transparent 18%),
          radial-gradient(circle at 78% 12%, rgba(85, 205, 255, 0.08), transparent 22%),
          linear-gradient(180deg, #15102d 0%, #0c1a38 52%, #08111d 100%);
        animation: skyDrift 10s ease-in-out infinite;
      }

      .stars {
        position: absolute;
        inset: 0 0 36% 0;
        opacity: 0.55;
        background-image:
          radial-gradient(circle at 18% 30%, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
          radial-gradient(circle at 62% 18%, rgba(150, 226, 255, 0.8) 0 1px, transparent 1.5px),
          radial-gradient(circle at 78% 40%, rgba(255, 160, 230, 0.7) 0 1px, transparent 1.5px),
          radial-gradient(circle at 36% 16%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px);
      }

      .sun {
        position: absolute;
        left: 50%;
        top: 52px;
        width: 168px;
        height: 168px;
        margin-left: -84px;
        border-radius: 50%;
        animation: sunPulse 4.8s ease-in-out infinite;
      }

      .sun::before {
        content: "";
        position: absolute;
        inset: 10% 0 0;
        background:
          repeating-linear-gradient(
            180deg,
            rgba(9, 14, 24, 0) 0 2px,
            rgba(9, 14, 24, 0.24) 2px 3px,
            rgba(9, 14, 24, 0) 3px 5px
          ),
          linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
        animation: stripeDrift 3.2s ease-in-out infinite;
      }

      .sun.warm {
        background:
          radial-gradient(circle at 50% 28%, rgba(255,255,255,0.32), transparent 18%),
          linear-gradient(180deg, #ffe19d 0%, #ffab73 18%, #ff5e8f 42%, #f14bcb 64%, rgba(241, 75, 203, 0.12) 100%);
        box-shadow:
          0 0 34px rgba(255, 134, 115, 0.26),
          0 0 72px rgba(241, 75, 203, 0.12);
      }

      .sun.cool {
        background:
          radial-gradient(circle at 50% 28%, rgba(255,255,255,0.3), transparent 18%),
          linear-gradient(180deg, #ffd799 0%, #ff8f6b 16%, #ff4b8f 34%, #b254ff 58%, #4fd8ff 76%, rgba(79, 216, 255, 0.08) 100%);
        box-shadow:
          0 0 30px rgba(255, 120, 160, 0.22),
          0 0 68px rgba(79, 216, 255, 0.14);
      }

      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 214px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(111, 229, 255, 0.88), transparent);
        box-shadow: 0 0 12px rgba(111, 229, 255, 0.34);
        animation: horizonPulse 3.6s ease-in-out infinite;
      }

      .gridfloor {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -18px;
        height: 164px;
        background:
          linear-gradient(rgba(111, 229, 255, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(111, 229, 255, 0.14) 1px, transparent 1px);
        background-size: 100% 24px, 46px 100%;
        transform: perspective(420px) rotateX(73deg);
        transform-origin: top center;
        opacity: 0.62;
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0));
        animation: gridScroll 2.8s linear infinite;
      }

      .scan::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 36%;
        background: linear-gradient(180deg, rgba(111, 229, 255, 0.18), rgba(111, 229, 255, 0.06) 32%, transparent 100%);
        animation: scanSweep 5.6s linear infinite;
      }

      .search {
        position: absolute;
        left: 50%;
        bottom: 42px;
        transform: translateX(-50%);
        width: min(92%, 440px);
        height: 60px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(18, 28, 44, 0.96), rgba(11, 18, 31, 0.98));
        border: 1px solid rgba(94, 214, 244, 0.16);
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.26);
      }

      .search::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 18px;
        border: 1px solid rgba(140, 238, 255, 0.96);
        box-shadow:
          0 0 0 1px rgba(94, 214, 244, 0.14),
          0 0 20px rgba(94, 214, 244, 0.22),
          inset 0 0 18px rgba(94, 214, 244, 0.05);
        animation: outlineTravel 3.4s linear infinite;
      }

      .notes {
        padding: 16px 18px 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .notes strong {
        color: var(--text);
      }

      @keyframes skyDrift {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(0, -6px, 0) scale(1.02); }
        100% { transform: translate3d(0, 0, 0) scale(1); }
      }

      @keyframes sunPulse {
        0% { transform: translateY(0) scale(1); filter: saturate(1) brightness(1); }
        50% { transform: translateY(1px) scale(1.015); filter: saturate(1.08) brightness(1.04); }
        100% { transform: translateY(0) scale(1); filter: saturate(1) brightness(1); }
      }

      @keyframes stripeDrift {
        0% { transform: translateY(0); opacity: 0.78; }
        50% { transform: translateY(1px); opacity: 0.9; }
        100% { transform: translateY(0); opacity: 0.78; }
      }

      @keyframes horizonPulse {
        0%, 100% { opacity: 0.7; box-shadow: 0 0 12px rgba(111, 229, 255, 0.28); }
        50% { opacity: 1; box-shadow: 0 0 18px rgba(111, 229, 255, 0.5); }
      }

      @keyframes gridScroll {
        0% { background-position: 0 0, 0 0; }
        100% { background-position: 0 28px, 46px 0; }
      }

      @keyframes scanSweep {
        0% { transform: translateY(-120%); opacity: 0; }
        12% { opacity: 0.55; }
        40% { opacity: 0.18; }
        100% { transform: translateY(140%); opacity: 0; }
      }

      @keyframes outlineTravel {
        0% { opacity: 0.15; clip-path: inset(0 88% 0 0 round 18px); }
        25% { opacity: 0.9; clip-path: inset(0 56% 0 0 round 18px); }
        50% { opacity: 0.9; clip-path: inset(0 0 0 0 round 18px); }
        75% { opacity: 0.9; clip-path: inset(0 0 0 56% round 18px); }
        100% { opacity: 0.15; clip-path: inset(0 0 0 88% round 18px); }
      }

      @media (max-width: 1100px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>太阳配色对比</h1>
      <p class="subtitle">同一套背景、同一套条纹密度、同一套动画。这里只比较太阳色温：左边偏亮橙粉，右边偏青紫橙混合。</p>

      <div class="grid">
        <section class="card">
          <div class="head">
            <p class="eyebrow">A</p>
            <h2>亮橙粉</h2>
          </div>
          <div class="mock">
            <div class="scene"></div>
            <div class="stars"></div>
            <div class="sun warm"></div>
            <div class="horizon"></div>
            <div class="gridfloor"></div>
            <div class="scan"></div>
            <div class="search"></div>
          </div>
          <div class="notes">
            <strong>感觉</strong>：更接近经典 synthwave 海报，太阳本体更抢眼。<br />
            <strong>风险</strong>：如果页面其他元素不压住，容易让搜索框显得偏次要。
          </div>
        </section>

        <section class="card">
          <div class="head">
            <p class="eyebrow">B</p>
            <h2>青紫橙混合</h2>
          </div>
          <div class="mock">
            <div class="scene"></div>
            <div class="stars"></div>
            <div class="sun cool"></div>
            <div class="horizon"></div>
            <div class="gridfloor"></div>
            <div class="scan"></div>
            <div class="search"></div>
          </div>
          <div class="notes">
            <strong>感觉</strong>：更偏夜间控制台，和 cyan HUD 的统一性更强。<br />
            <strong>风险</strong>：如果青色占比再高一点，太阳会少一点“热源中心”的味道。
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
